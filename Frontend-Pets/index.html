<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção de Pets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Adote um Amigo</h1>
        <p>Encontre o seu novo companheiro hoje mesmo!</p>
    </header>

    <main>
        <section class="cadastro-section">
            <h2>Cadastrar Novo Pet</h2>
            <form id="petForm">
                <input type="text" id="nome" placeholder="Nome do Pet" required>
                <input type="text" id="especie" placeholder="Espécie (Cachorro, Gato...)" required>
                <input type="text" id="raca" placeholder="Raça">
                <input type="number" id="idade" placeholder="Idade (anos)" required>
                <select id="sexo" required>
                    <option value="">Selecione o Sexo</option>
                    <option value="Macho">Macho</option>
                    <option value="Fêmea">Fêmea</option>
                </select>
                <select id="tamanho" required>
                    <option value="">Selecione o Tamanho</option>
                    <option value="Pequeno">Pequeno</option>
                    <option value="Médio">Médio</option>
                    <option value="Grande">Grande</option>
                </select>
                <input type="text" id="descricaoCurta" placeholder="Resumo (ex: Dócil e castrado)" required>
                <input type="text" id="cidade" placeholder="Sua Cidade" required>
                <input type="text" id="contato" placeholder="Seu Telefone/Email" required>
                <input type="text" id="urlImagem" placeholder="Link de uma foto na internet (URL)">
                
                <label class="checkbox-label">
                    <input type="checkbox" id="fazEntrega"> Você tem como entregar o animal?
                </label>
                <input type="number" id="distanciaEntregaKm" placeholder="Distância máxima de entrega (km)">
                
                <textarea id="historia" placeholder="Conte um pouco da história do animal..."></textarea>
                
                <button type="submit">Cadastrar Animal para Adoção</button>
            </form>
        </section>

        <section class="lista-section">
            <h2>Animais Esperando por um Lar</h2>
            <div id="petsContainer" class="pets-grid">
              
            </div>
        </section>
    </main>

    
    <div id="petModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
